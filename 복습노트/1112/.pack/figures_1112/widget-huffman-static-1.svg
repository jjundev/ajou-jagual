<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="1/4 단계. 위쪽은 허프만 트리: 원(테두리)은 글자 단말 노드, 둥근 사각형(테두리)은 합친 노드예요. 이번에 4와 6을 합쳐 10 노드를 만들었고, 이 셋은 강조색 테두리이며 새 노드는 한 겹 더 둘러져 있어요. 아래쪽 최소 힙 배열 1번 칸부터: 8, 10, 15, 12."><style>
