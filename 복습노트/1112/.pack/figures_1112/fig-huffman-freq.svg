<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="테두리 막대 다섯 개. 글자 e는 15번, t는 12번, n은 8번, i는 6번, s는 4번 나와 막대 길이가 그 횟수만큼 길어요."><style>
