<svg xmlns="http://www.w3.org/2000/svg" width="640" height="235" viewBox="0 0 640 235" role="img" aria-label="나무 그림. 맨 위 작은 테두리 원에서 가지가 갈라져 내려가요. 둘째 줄 아래에 글자 n, t, e가 든 테두리 원이 있고, 한 줄 더 내려간 맨 아래에 글자 s, i가 든 테두리 원이 있어요. 오른쪽에 위 줄은 두 칸짜리 이름, 아래 줄은 세 칸짜리 이름이라고 적혀 있어요."><style>
