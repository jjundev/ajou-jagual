<svg xmlns="http://www.w3.org/2000/svg" width="600" height="225" viewBox="0 0 600 225" role="img" aria-label="왼쪽 테두리 서랍 안에 숫자가 적힌 테두리 원 일곱 개가 아무렇게나 흩어져 있음. 오른쪽 테두리 서랍에서는 가장 큰 23만 맨 앞에 있다가 강조색 테두리 원으로 강조색 선 화살표를 따라 위로 꺼내져 있고, 나머지 20, 15, 7, 9, 1, 4 테두리 원은 순서 없이 대충 놓여 있음."><style>
