<svg xmlns="http://www.w3.org/2000/svg" width="340" height="140" viewBox="0 0 340 140" role="img" aria-label="두 수의 순서를 유지하면서 계산 표시를 앞, 사이, 뒤에 두는 세 가지 줄의 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="340" height="140" rx="10" fill="#ffffff"/><text class="fig-text" x="22" y="32">앞</text><text class="fig-text" x="22" y="68">사이</text><text class="fig-text" x="22" y="104">뒤</text><rect class="fig-accent" x="79" y="13" width="73" height="26"/><text class="fig-text" x="87" y="32">계산 표시</text><text class="fig-text" x="176" y="32">첫 수   다음 수</text><text class="fig-text" x="84" y="68">첫 수</text><rect class="fig-accent" x="154" y="49" width="73" height="26"/><text class="fig-text" x="162" y="68">계산 표시</text><text class="fig-text" x="245" y="68">다음 수</text><text class="fig-text" x="84" y="104">첫 수   다음 수</text><rect class="fig-accent" x="234" y="85" width="73" height="26"/><text class="fig-text" x="242" y="104">계산 표시</text></svg>
