<svg xmlns="http://www.w3.org/2000/svg" width="540" height="200" viewBox="0 0 540 200" role="img" aria-label="왼쪽은 동그라미 세 개가 한 줄로 비스듬히 이어진 마른 나무, 오른쪽은 층마다 하나, 둘, 넷씩 동그라미 일곱 개가 꽉 찬 나무. 마른 나무의 동그라미는 테두리만 있고, 꽉 찬 나무의 동그라미는 강조색 테두리다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
