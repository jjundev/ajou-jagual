<svg xmlns="http://www.w3.org/2000/svg" width="360" height="170" viewBox="0 0 360 170" role="img" aria-label="선으로 그린 산에 낮은 봉우리와 더 높은 봉우리가 있어요. 색칠된 점의 사람이 강조색 선을 따라 가까운 낮은 봉우리로 올라가요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
