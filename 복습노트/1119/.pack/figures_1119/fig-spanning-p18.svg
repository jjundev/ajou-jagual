<svg xmlns="http://www.w3.org/2000/svg" width="330" height="350" viewBox="0 0 330 350" role="img" aria-label="왼쪽 위 칸은 정점 0부터 4까지 테두리 원과 선 7개로 된 연결 그래프예요. 나머지 세 칸은 같은 정점에 강조색 선 4개만 남긴 신장 트리로, 오른쪽 위 깊이 우선은 0-1, 1-2, 2-3, 3-4, 왼쪽 아래 너비 우선은 0-1, 0-2, 0-4, 2-3, 오른쪽 아래 다른 순서는 0-1, 1-2, 0-4, 3-4를 남겼어요."><style>
