<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-label="왼쪽에는 테두리 동그라미 다섯 개가 선으로 한 줄로 길게 이어져 있다. 오른쪽에는 테두리 동그라미 하나에서 세 갈래 선이 뻗고, 그중 하나에서 한 갈래가 더 뻗는다. 두 그림 모두 선이 돌아서 제자리로 오지 않는다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
