<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160" role="img" aria-label="색칠된 점 세 개가 마을이에요. 강조색 선 두 개는 1,000원 길, 위쪽 선 하나는 10,000원 길이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
