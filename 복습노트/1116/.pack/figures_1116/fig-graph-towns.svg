<svg xmlns="http://www.w3.org/2000/svg" width="470" height="230" viewBox="0 0 470 230" role="img" aria-label="서울, 강릉, 수원, 제천, 대구가 적힌 테두리 원 다섯 개. 서울–강릉–제천–수원–서울을 잇는 강조색 선 네 개가 한 바퀴 고리를 이루고, 제천과 대구는 기본색 선 하나로 이어져 있음."><style>
