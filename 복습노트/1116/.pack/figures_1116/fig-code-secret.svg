<svg xmlns="http://www.w3.org/2000/svg" width="550" height="190" viewBox="0 0 550 190" role="img" aria-label="위 줄은 테두리 상자 &#x27;싫어&#x27;에서 화살표가 테두리 상자 &#x27;시버러버&#x27;로 가요. 아래 줄은 0과 1이 길게 늘어선 긴 테두리 상자에서 화살표가 &#x27;0 스무 개, 1 마흔 개&#x27;라고 적힌 짧은 강조색 테두리 상자로 가요."><style>
