<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110" role="img" aria-label="다섯 칸짜리 테두리 방이 한 줄로 있고, 첫 칸에만 색칠된 동그라미 도장이 찍혀 있다. 첫 칸에서 둘째 칸으로 선 화살표가 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
