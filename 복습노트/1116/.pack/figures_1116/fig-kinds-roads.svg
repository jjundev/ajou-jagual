<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190" role="img" aria-label="위 줄: 집과 학교를 뜻하는 테두리 원 두 개가 화살표 없는 강조색 선으로 이어짐(양쪽으로 다니는 길). 아래 줄: 같은 두 원이 학교 쪽에 화살촉이 달린 강조색 선으로 이어짐(한쪽으로만 가는 길)."><style>
