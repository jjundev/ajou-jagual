<svg xmlns="http://www.w3.org/2000/svg" width="430" height="230" viewBox="0 0 430 230" role="img" aria-label="왼쪽: 테두리 원 A, B, C, D가 선 네 개 A–B, A–C, B–D, C–D로 고리를 이룸. 가운데 오른쪽 화살표. 오른쪽: 같은 그래프에서 C–D 선만 위험색 점선으로 표시해 잘라 내자 A를 맨 위로 한 트리 모양이 됨."><style>
