<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS Interactive</title><script id="interactive-theme">(() => {
  const root = document.documentElement;
  const system = matchMedia('(prefers-color-scheme: dark)');
  const key = 'od-theme';
  const preference = value => value === 'light' || value === 'dark' ? value : null;
  const systemTheme = () => system.matches ? 'dark' : 'light';
  let override = null;
  let button;

  try { override = preference(localStorage.getItem(key)); } catch {}

  function apply() {
    const theme = override || systemTheme();
    root.dataset.theme = theme;
    if (!button) return;

    const dark = theme === 'dark';
    const label = dark ? '라이트 모드로 전환' : '다크 모드로 전환';
    const icon = dark
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 4l2 2m12 12 2 2M2 12h2m16 0h2M4 20l2-2M18 6l2-2"/>'
      : '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
    button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + icon + '</svg>';
    button.setAttribute('aria-label', label);
    button.title = label;
  }

  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    override = preference(event.newValue);
    apply();
  });
  document.addEventListener('DOMContentLoaded', () => {
    button = document.querySelector('[data-action="theme"]');
    button.addEventListener('click', event => {
      // Archived players still delegate this button's click at the app root.
      event.stopPropagation();
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      override = next === systemTheme() ? null : next;
      try {
        if (override) localStorage.setItem(key, override);
        else localStorage.removeItem(key);
      } catch {}
      apply();
    });
    apply();
  }, {once: true});
})();

          .find(button => id && button.dataset.cellId === id || frame && button.dataset.inspectFrame === frame ||
            node && button.dataset.nodeId === node)?.focus({preventScroll: true});

      reset() {

        followedTop = list.scrollTop = 0;
      },
      destroy() {
        playback.close();
        design.destroy?.();
      },

<script>(function (root) {
  'use strict';
  const D = root.DSInteractive;

  function resultLine(title, text) {
    const result = D.el('section');
    result.append(D.el('h3', '', title), D.el('p', 'study-result-line', text));
    return result;
  }

  function watchCells(entries, active, cells, exclude) {
    return entries.flatMap(entry => {
      const id = entry.cellId ?? active + '.' + entry.name;
      if (exclude?.has(entry.name) && !entry.cellId) return [];
      const cell = cells[id];
      return [{id: entry.name, label: entry.label, name: entry.name, cell: id,
        value: cell?.lifetime === 'live' ? D.format(cell.value) : '—'}];
    });
  }

  function studyMemory(app, scenario) {
    let latest, diagram;
    const selectionDetails = ({state}, id) => {
      const cell = state.cells[id];
      if (!cell) return D.el('p', '', '메모리에서 변수를 선택하면 주소와 값을 확인할 수 있어요.');
      const details = D.el('dl');
      const add = (term, text) => details.append(D.el('dt', '', term), D.el('dd', '', text));
      add(cell.name + '의 주소', cell.address);
      add('저장 값', D.format(cell.value));
      if (cell.lifetime === 'ended') add('수명', '종료');
      if (cell.lifetime === 'live' && cell.value.kind === 'pointer' && cell.value.target !== null) {
        const target = state.cells[cell.value.target];
        if (target) add('대상의 값', D.format(target.value));
      }
      return details;
    };
    return {
      heading: '호출과 메모리',
      note: '주소는 기호로 표시',
      memory: true,
      selectionDetails,
      redraw() { if (diagram?.isConnected) D.drawArrows(diagram, latest.snapshot, latest.selection); },
      render(snapshot, {selection, trace}) {
        const {state, writes} = snapshot;
        const cells = Object.values(state.cells).filter(cell => cell.lifetime === 'live');
        const selected = state.cells[selection];
        const pointer = selected?.lifetime === 'live' && selected.value.kind === 'pointer' ? selected
          : cells.find(cell => cell.owner === state.activeFrame && cell.value.kind === 'pointer')
            || cells.find(cell => cell.value.kind === 'pointer');
        const firstPointer = pointer || Object.values(trace.snapshots.at(-1).state.cells)
          .find(cell => cell.value.kind === 'pointer');
        const target = pointer ? state.cells[pointer.value.target] : undefined;
        const current = [
          {id: 'pointer', name: firstPointer?.name, label: '현재 포인터', cell: pointer?.id,
            value: pointer && D.format(pointer.value)},
          {id: 'target', name: target?.name, label: '대상의 값', cell: target?.id,
            value: target && D.format(target.value)},
          ...watchCells(scenario.watch || [], state.activeFrame, state.cells),
        ];
        const lastWrite = state.cells[writes.at(-1)?.cellId];
        const persistent = cells.filter(cell => cell.value.kind === 'int' &&
          (cell.owner === state.activeFrame || state.objects[cell.owner]));
        const resultCells = target?.lifetime === 'live' ? [target]
          : lastWrite?.lifetime === 'live' ? [lastWrite] : persistent.slice(0, 2);
        const resultText = resultCells.map(cell => cell.name + ' = ' + D.format(cell.value)).join(' · ') || '아직 결과 없음';

        overview.tabIndex = 0;
        overview.setAttribute('role', 'region');

        diagram = D.el('div', 'study-memory-cells');

  function studyTree(app, scenario, {stop, repaint}) {

    app.append(dialog);

    dialog.addEventListener('close', () => {
      node = null;
      [...app.querySelectorAll('button[data-node-id]')]
        .find(button => button.dataset.nodeId === opener)?.focus({preventScroll: true});

    }, {signal: events.signal});
    app.addEventListener('click', event => {
      const button = event.target.closest('button');

      heading: '전체 트리',

        const view = D.getTreeView(metadata.tree, snapshot);
        const parameterId = view.stack[0]?.parameterCellId;
        const parameter = state.cells[parameterId];
        const final = trace.lineSteps.at(-1).state;
        const names = new Set(Object.values(final.frames).filter(frame => frame.parameterCellId)
          .map(frame => final.cells[frame.parameterCellId].name));
        const pointer = parameter?.value;
        const targetCell = pointer && state.cells[pointer.target];
        const target = targetCell && view.nodes.find(item => item.id === targetCell.owner);
        const current = [{id: 'node', label: '현재 호출이 가리키는 노드', cell: parameterId,
          name: parameter?.name || (names.size === 1 ? [...names][0] : undefined),
          value: target ? target.key + '번 노드' : D.format(pointer)}];
        current.push(...watchCells(scenario.watch || [], state.activeFrame, state.cells, names));
        const overview = D.el('div', 'study-tree-scroll');
        overview.tabIndex = 0;
        overview.setAttribute('role', 'region');
        overview.setAttribute('aria-label', '트리 그림');
        overview.append(renderer.render(snapshot, null, metadata, view));
        const detail = D.el('section');

        detail.append(D.el('h3', '', '호출 스택'), D.renderStackDetails(snapshot, view, expanded,
          !snapshot.diagnostic && ended?.lifetime === 'ended' ? ended : null, metadata.tree.fields.key));
        if (node) body.replaceChildren(D.renderNodeDetails(snapshot, view, node));
        return {overview, result: resultLine('출력', state.stdout.join('') || '아직 출력 없음'), current, detail};
      },
    };
  }

  Object.assign(D, {studyMemory, studyTree});
})(globalThis);

    const presetCoversTree = tree && scenario.inputs.length === 1 && onlyField.type === 'enum' &&
      onlyField.options.every(option => option.value === onlyField.default ||
        scenario.presets.some(item => item.input[onlyField.key] === option.value));

    const scrub = q('[data-action=scrub]');
    const preset = q('[data-action=preset]');

    let step = 0;

    q('.takeaway').textContent = scenario.takeaway || '';
    q('.provenance-text').textContent = scenario.sources.map(source =>
      [source.label || source.id, source.provenance?.path, source.provenance?.page && 'p' + source.provenance.page,
        source.provenance?.section, source.provenance?.adjustments].filter(Boolean).join(' · ')).join('\n');

    for (const item of scenario.presets) preset.append(new Option(item.label, item.id));

<script>(function (root) {
  'use strict';
  const D = root.DSInteractive;

  function graphHistoryRows(trace, entries, list) {
    const locations = entries.map(entry => entry.executed?.at ?? entry.at);
    const sources = new Map(trace.sources.map(source => [source.id, source.label || source.id]));
    const sourceIds = new Set(locations.map(location => location?.sourceId).filter(Boolean));
    const header = list.previousElementSibling;
    header.hidden = sourceIds.size !== 1;
    header.textContent = header.hidden ? '' : sources.get(sourceIds.values().next().value);

    return entries.map((entry, index) => {
      const location = locations[index];
      const source = sources.get(location?.sourceId);
      const line = location ? location.line + '행' : '';
      const button = D.el('button', 'btn');
      button.type = 'button';
      button.dataset.action = 'step';
      button.dataset.stepIndex = index;
      button.setAttribute('aria-label', [index, source, line, entry.title].filter(value => value != null && value !== '').join(' '));

      const text = D.el('span', 'step-txt');
      const detail = D.el('span', 'graph-history-detail');
      detail.append(D.el('span', 'graph-history-action', entry.title));
      if (source && sourceIds.size > 1) detail.append(D.el('span', 'graph-history-row-source', source));
      text.append(D.el('b', 'graph-history-line', line), detail);
      button.append(D.el('span', 'step-num num', index), text);
      return button;
    });
  }

  function attachGraphHistory(list, syncHistory, signal) {
    const source = D.el('p', 'graph-history-source');
    source.hidden = true;
    list.before(source);
    const observer = new ResizeObserver(syncHistory);
    observer.observe(list);
    signal.addEventListener('abort', () => observer.disconnect(), {once: true});
  }

  D.graphHistoryRows = graphHistoryRows;
  D.attachGraphHistory = attachGraphHistory;
})(globalThis);
</script>

  'use strict';

  // Keep the origin of a new cell available even when a tree groups several events into one line.
  const applyEvent = D.applyEvent;
  D.applyEvent = (state, event, limits) => {
    const result = applyEvent(state, event, limits);
    for (const write of result.writes) {
      if (write.before === null) {
        result.state.cells[write.cellId].creation = {kind: event.kind, label: event.label};
      }
    }
    return result;
  };

  const beforeCreation = {
    bind: '전달 전',
    declare: '선언 전',
    allocate: '할당 전',
  };

  function format(value, state) {
    if (value?.kind !== 'pointer' || value.target === null) return D.format(value);
    const target = state.cells[value.target];
    const object = state.objects[target?.owner];
    if (object?.type === 'GraphType' && object.cellIds[0] === target.id) return '그래프 주소';
    return target?.address?.startsWith('&') ? target.address : D.format(value);
  }

  function renderPanelChanges(container, {state, writes}) {
    container.replaceChildren(...writes.map(write => {
      const cell = state.cells[write.cellId];
      const creation = write.before === null ? cell?.creation : null;
      const before = write.before === null ? beforeCreation[creation?.kind] ?? '저장 공간 없음' :
        format(write.before, state);
      const after = format(write.after, state);
      const name = cell?.name ?? write.cellId;
      let role;
      if (creation?.kind === 'bind') {
        if (after === '그래프 주소') role = '그래프 포인터';
        else if (creation.label === '정점 번호 전달') role = '정점 번호';
      }
      const row = D.el('div', 'change');
      row.append(D.el('strong', '', role ? name + ' (' + role + ')' : name),
        D.el('div', '', before + ' → ' + after));
      return row;
    }));
    if (!writes.length) container.append(D.el('p', 'trace-message', '이 단계에서는 저장 값이 바뀌지 않았습니다.'));
  }

  D.renderPanelChanges = renderPanelChanges;
})(DSInteractive);
</script>

<style>.topbar > .header-case-moved {
  display: block;
  flex: 0 1 19rem;
  min-width: 0;
}
.topbar > .header-case-moved select {
  width: 100%;
  min-height: 44px;

@media (max-width: 720px) {
  .topbar:has(> .header-case-moved) {
    flex-wrap: wrap;
  }
  .topbar > .header-case-moved {
    order: 1;
    flex-basis: 100%;
  }
  .topbar .graph-header-tools {
    grid-column-start: 1;
  }
}
</style>
<script>(() => {
  const app = document.querySelector('#app');
  const header = app.querySelector('.topbar');
  const preset = app.querySelector('[data-action=preset]');
  const fields = [...app.querySelectorAll('[data-input]')];

  // Graph traversal already exposes its single setup selector in the header.
  if (preset.closest('label').hidden) return;

  const label = preset.closest('label');
  if (!header.contains(preset)) {
    label.classList.add('header-case-moved');
    header.insertBefore(label, header.querySelector('[data-action=theme]'));
  }

  const enums = fields.filter(field => field.tagName === 'SELECT' && !field.closest('[hidden]'));
  const {inputs, presets} = DSInteractive.scenario;
  const defaults = Object.fromEntries(inputs.map(field => [field.key, field.default]));
  const cases = new Map([['default', defaults], ...presets.map(item => [item.id, item.input])]);
  const combinations = new Map();
  const savedLabels = new Set([...preset.options].map(option => option.label));
  let nextChoice = 0;

  if (enums.length) {
    const configuration = enums[0].closest('.configuration');
    const addOptions = (index, values, names, parent) => {
      if (index === enums.length) {
        let id;
        do { id = 'header-choice-' + nextChoice++; } while (cases.has(id));
        combinations.set(id, values);
        const caption = names.join(' · ');
        const option = new Option(savedLabels.has(caption) ? caption + ' · 입력 유지' : caption, id);
        option.dataset.headerChoice = '';
        parent.append(option);
        return;
      }
      const field = enums[index];
      for (const option of field.options) {
        addOptions(index + 1, [...values, option.value], [...names, option.label], parent);
      }
    };

    if (enums.length === 1) {
      const group = document.createElement('optgroup');
      group.label = enums[0].getAttribute('aria-label');
      addOptions(0, [], [], group);
      preset.append(group);
    } else {
      for (const option of enums[0].options) {
        const group = document.createElement('optgroup');
        group.label = option.label;
        addOptions(1, [option.value], [option.label], group);
        preset.append(group);
      }
    }

    for (const field of enums) field.closest('label').hidden = true;
    if (!fields.some(field => configuration.contains(field) && !field.closest('[hidden]'))) {
      configuration.hidden = true;
    }
  }

  if (!fields.some(field => !field.closest('[hidden]')) && !combinations.size) return;
  let custom = [...preset.options].find(option => option.disabled && option.value === 'custom');
  if (!custom) {
    let id = 'custom';
    while (cases.has(id)) id += '-';
    custom = new Option('직접 설정', id);
    custom.disabled = true;
    preset.append(custom);
  }

  const matchesInput = input => input && fields.every(field =>
    field.value === String(input[field.dataset.input]));

  function sync(preferred = preset.value) {
    if (matchesInput(cases.get(preferred))) {
      preset.value = preferred;
      return;
    }
    const match = [...cases].find(([, input]) => matchesInput(input));
    const context = enums.map(field => field.selectedOptions[0]?.label).filter(Boolean);
    custom.textContent = ['직접 설정', ...context].join(' · ');
    preset.value = match?.[0] ?? custom.value;
  }

  preset.addEventListener('change', event => {
    const choice = preset.value;
    const values = combinations.get(choice);
    if (!values) return;
    event.stopImmediatePropagation();
    for (const [index, field] of enums.entries()) {
      if (field.value === values[index]) continue;
      field.value = values[index];
      field.dispatchEvent(new Event('change', {bubbles: true}));
    }
    preset.value = choice;
  }, {capture: true});

  // The player updates the backing controls synchronously before these listeners.
  app.addEventListener('change', event => {
    if (event.target.matches('[data-input]')) sync();
  });
  app.addEventListener('input', event => {
    if (event.target.matches('input[data-input]')) sync();
  });
  app.addEventListener('click', event => {
    if (event.target.closest('[data-mode-value]')) sync();
  });
})();
</script>

<span id="interactive-example-copy" hidden>홀수 차수인 지점의 수로 모든 다리를 한 번씩 건널 수 있는지 판단하세요.</span>
<script>(function () {
  const panel = document.querySelector('#panel-right');
  const changes = panel.querySelector('.changes');
  if (changes) {
    const container = changes.parentElement;
    const title = document.createElement('h3');
    title.className = 'panel-changes-title';
    title.textContent = container.firstElementChild.textContent;

    if (container.matches('details')) {
      const section = document.createElement('section');
      section.className = 'panel-changes';
      section.append(title, changes);
      container.replaceWith(section);
    } else {
      container.firstElementChild.replaceWith(title);
    }
  }

  const example = panel.querySelector('.tree-example, .provenance');
  const summary = example.querySelector('summary');
  const oldTakeaway = panel.querySelector('.takeaway');
  const copy = document.querySelector('#interactive-example-copy').textContent.trim() ||
    DSInteractive.scenario.takeaway?.trim();

  oldTakeaway?.closest('section').remove();
  if (!copy) {
    example.remove();
    return;
  }

  summary.textContent = '예제 정보';
  const message = document.createElement('p');
  message.className = 'example-summary';
  message.textContent = copy;
  example.replaceChildren(summary, message);
}());
</script>
