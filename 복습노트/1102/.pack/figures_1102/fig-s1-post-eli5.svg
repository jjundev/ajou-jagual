<svg xmlns="http://www.w3.org/2000/svg" width="480" height="205" viewBox="0 0 480 205" role="img" aria-label="큰 상자 아래 상자 둘, 오른쪽 상자 아래 작은 상자 둘이 선으로 이어진 테두리 상자 그림. 재는 순서 번호는 왼쪽 상자 1, 작은 상자 2와 3, 오른쪽 상자 4, 큰 상자 5"><style>
