<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" role="img" aria-label="테두리 동그라미 여섯 개로 된 나무 그림. 위에서 아래로, 왼쪽에서 오른쪽으로 1부터 6까지 번호가 붙어 있고, 오른쪽의 네모 칸 일곱 개에 같은 번호대로 들어가 있다. 7번 칸은 비어 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
