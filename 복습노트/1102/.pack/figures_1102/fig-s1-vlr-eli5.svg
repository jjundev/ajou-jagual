<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="같은 모양 세 개. 각각 강조색 테두리 동그라미 맨 위 하나 아래에 선 테두리 삼각형 왼쪽과 오른쪽이 있고 들르는 순서 번호가 적혀 있음. 첫째는 맨 위 1, 왼쪽 2, 오른쪽 3. 둘째는 왼쪽 1, 맨 위 2, 오른쪽 3. 셋째는 왼쪽 1, 오른쪽 2, 맨 위 3"><style>
