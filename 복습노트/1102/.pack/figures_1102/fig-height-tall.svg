<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-label="맨 위 강조색으로 색칠된 동그라미 아래 왼쪽에 긴 삼각형, 오른쪽에 짧은 삼각형이 선으로 그려져 있고, 왼쪽 삼각형 옆에 위아래 화살표로 길이를 잰 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
