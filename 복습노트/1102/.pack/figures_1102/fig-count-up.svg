<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-label="테두리 동그라미 여섯 개로 된 나무 그림. 맨 위 동그라미 옆에 6, 왼쪽 가운데 동그라미 옆에 3, 오른쪽 가운데 동그라미 옆에 2, 맨 아래 동그라미 세 개 옆에 각각 1이 적혀 있다"><style>
