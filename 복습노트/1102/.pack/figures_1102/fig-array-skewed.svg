<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="테두리 동그라미 A, B, C, D가 왼쪽 아래로만 이어진 경사 이진 트리와, 0번부터 8번까지의 네모 칸. 1번 A, 2번 B, 4번 C, 8번 D만 차 있고 0번은 쓰지 않으며 3, 5, 6, 7번은 빈칸으로 남아 있다."><style>
