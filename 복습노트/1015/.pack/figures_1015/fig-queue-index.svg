<svg xmlns="http://www.w3.org/2000/svg" width="540" height="150" viewBox="0 0 540 150" role="img" aria-label="배열 앞 세 칸에서 빈 0번 칸 앞 표시와 가가 있는 1번 칸, 나가 있는 2번 칸 끝 표시"><style>
