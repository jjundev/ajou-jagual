<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="n = 5, 단계 5 / 10. 스택에 호출 상자 5개. factorial(1) 상자가 쌓여요. 1 &lt;= 1 이 참이라서 바닥 조건에 닿았어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="560" height="300" rx="10" fill="#ffffff"/><line class="fig-ink" x1="90" y1="274" x2="470" y2="274"/><text class="fig-muted" x="470" y="292" text-anchor="end">스택 바닥</text><rect class="fig-ink" x="120" y="230" width="320" height="40" rx="6"/><text class="fig-text" x="280" y="255" text-anchor="middle">factorial(5): 5 * factorial(4)</text><rect class="fig-ink" x="120" y="184" width="320" height="40" rx="6"/><text class="fig-text" x="280" y="209" text-anchor="middle">factorial(4): 4 * factorial(3)</text><rect class="fig-ink" x="120" y="138" width="320" height="40" rx="6"/><text class="fig-text" x="280" y="163" text-anchor="middle">factorial(3): 3 * factorial(2)</text><rect class="fig-ink" x="120" y="92" width="320" height="40" rx="6"/><text class="fig-text" x="280" y="117" text-anchor="middle">factorial(2): 2 * factorial(1)</text><rect class="fig-accent" x="120" y="46" width="320" height="40" rx="6"/><text class="fig-text" x="280" y="71" text-anchor="middle">factorial(1): 1 &lt;= 1, 1 을 돌려줌</text></svg>
