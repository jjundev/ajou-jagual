<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-label="테두리로 그린 자판기 앞면에 버튼 세 개와 동전 구멍, 음료 나오는 곳이 있고, 옆에 점선으로 그린 안쪽 기계 상자가 흐리게 가려져 있는 그림"><style>
