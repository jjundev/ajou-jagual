<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="테두리만 있는 상자 세 개가 겹겹이 들어 있고, 가장 안쪽 상자 가운데에 색칠된 점이 있는 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
