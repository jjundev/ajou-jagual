<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" role="img" aria-label="테두리 상자 안에 색칠된 점 다섯 개가 들어 있고, 상자 테두리 바깥쪽에 넣기, 꺼내기, 더하기라고 적힌 테두리 버튼 세 개가 붙어 있는 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="360" height="200" rx="10" fill="#ffffff"/>
      <rect class="fig-ink" x="90" y="30" width="180" height="140" rx="12" fill="none"/>
      <text class="fig-text" x="180" y="52" text-anchor="middle" font-size="13">담는 값</text>
      <circle class="fig-dot" cx="130" cy="90" r="9"/>
      <circle class="fig-dot" cx="170" cy="80" r="9"/>
      <circle class="fig-dot" cx="215" cy="95" r="9"/>
      <circle class="fig-dot" cx="150" cy="130" r="9"/>
      <circle class="fig-dot" cx="200" cy="135" r="9"/>
      <rect class="fig-accent" x="10" y="60" width="70" height="30" rx="8" fill="none"/>
      <text class="fig-text" x="45" y="80" text-anchor="middle" font-size="13">넣기</text>
      <rect class="fig-accent" x="10" y="110" width="70" height="30" rx="8" fill="none"/>
      <text class="fig-text" x="45" y="130" text-anchor="middle" font-size="13">꺼내기</text>
      <rect class="fig-accent" x="280" y="85" width="70" height="30" rx="8" fill="none"/>
      <text class="fig-text" x="315" y="105" text-anchor="middle" font-size="13">더하기</text>
