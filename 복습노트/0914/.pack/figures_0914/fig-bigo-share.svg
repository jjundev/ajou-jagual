<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-label="긴 테두리 상자 하나가 거의 전부를 차지하고 오른쪽 끝에 아주 얇은 테두리 상자 하나가 붙어 있다. 긴 상자에는 제일 큰 덩어리, 얇은 상자에는 나머지라고 적혀 있다."><style>
