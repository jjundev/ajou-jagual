<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img" aria-label="가로축은 넣는 개수, 세로축은 해야 할 일. 한 번에 곱하기는 수평 선, 하나씩 더하기는 곧게 올라가는 선, 잘게 쪼개 더하기는 점점 가파르게 휘어 오르는 선"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
