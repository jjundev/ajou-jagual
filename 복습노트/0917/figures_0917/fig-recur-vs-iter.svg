<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="왼쪽에는 테두리만 있는 상자 세 개가 위아래로 놓여 아래로 묻고 위로 답을 돌려주고, 오른쪽에는 테두리 원 하나를 따라 도는 화살표가 있어요."><style>
