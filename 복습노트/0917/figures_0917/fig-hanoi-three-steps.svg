<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180" role="img" aria-label="세 장면이 나란히 있는 그림. 첫째 장면은 나머지 원판 덩어리(선만 있는 사다리꼴)가 가운데 막대로 가고, 둘째 장면은 가장 큰 원판(강조색 테두리)이 도착 막대로 가고, 셋째 장면은 덩어리가 그 위로 올라가요"><style>
