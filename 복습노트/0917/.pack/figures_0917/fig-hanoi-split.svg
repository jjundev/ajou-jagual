<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="도착 막대에 가장 큰 원판이 강조색 테두리로 놓여 있고, 가운데 막대의 작은 원판 두 개를 점선 테두리가 둘러싼 그림"><style>
