<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS Interactive</title><link rel="stylesheet" data-ds-interactive-font href="../_assets/problem-explain/v1/pretendard/pretendard.css"><style>/* Shell tokens and component geometry adapted from bio-interactive template. */
:root{color-scheme:light;--bg:#ffffff;--surface:#f7f8fa;--ink:#111111;--ink-2:#6b7280;--line:#d9dee7;--accent:#1677ff;--accent-ink:#1b64da;--btn-bg:#1b64da;--on-btn:#ffffff;--warn:#b54708;--scroll:#c9d0db;--scroll-hover:#9aa3b2;--read:#27598c;--ended:#6b7280}
html[data-theme=dark]{color-scheme:dark;--bg:#17171c;--surface:#212128;--ink:#f2f4f6;--ink-2:#a3abb8;--line:#34353d;--accent:#3182f6;--accent-ink:#6ea4ff;--btn-bg:#1b64da;--on-btn:#ffffff;--warn:#f5a15c;--scroll:#3f414b;--scroll-hover:#5b5e6a;--read:#abd1ff;--ended:#a3abb8}
html,body{height:100%;overflow:hidden}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}

html{height:100%}body{height:100%;margin:0}
.app{--radius:8px;--tap:48px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--dur:220ms;--dur-exit:150ms;--ease-out:cubic-bezier(.2,.8,.2,1);--scrim:rgba(0,0,0,.4);
  height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;box-sizing:border-box;
  background:var(--bg);color:var(--ink);font-family:'Pretendard',system-ui,sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.app *,.app *::before,.app *::after{box-sizing:border-box}
.app button{font-family:inherit;color:inherit}
.app :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

.topbar{display:flex;align-items:center;gap:var(--s2);min-height:56px;padding:var(--s2) var(--s3);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:17px;font-weight:700;white-space:nowrap}
.text-btn{flex:none;min-height:44px;min-width:44px;padding:0 var(--s3);border:0;border-radius:var(--radius);background:transparent;color:var(--ink);font:600 14px/1 'Pretendard',system-ui,sans-serif;cursor:pointer}
.panel-toggle{display:inline-flex;align-items:center;gap:var(--s1);padding:0 var(--s2)}
.panel-toggle svg,.theme-toggle svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel-toggle .strip{fill:transparent;stroke:none;transition:fill 150ms ease-out}
.panel-toggle[aria-expanded="true"]{color:var(--accent-ink)}
.panel-toggle[aria-expanded="true"] .strip{fill:currentColor}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;padding:0}
.seg{flex:none;display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--radius)}
.seg button{min-height:40px;padding:0 var(--s3);border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--on-btn)}

.layout{display:grid;grid-template-columns:auto minmax(320px,1fr) auto;min-height:0}
.panel{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg);color:var(--ink)}
.panel-left{grid-column:1;width:clamp(260px,20vw,320px);border-right:1px solid var(--line)}
.panel-right{grid-column:3;width:clamp(320px,24vw,400px);border-left:1px solid var(--line)}
.panel-inner{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--s4) var(--s4) var(--s6)}
.panel-inner::-webkit-scrollbar{width:8px}
.panel-inner::-webkit-scrollbar-track{background:transparent}
.panel-inner::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid var(--bg)}
.panel-inner::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}
@supports (scrollbar-color:auto){.panel-inner{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}}
.panel-head{display:flex;align-items:center;gap:var(--s2);min-height:44px;margin-bottom:var(--s2)}
.panel-head h2{flex:1 1 0;min-width:0;margin:0;font-size:22px;line-height:1.4}
.stage{grid-column:2;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.scrim{display:none}
.panel-resize{display:none}

.sec{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line)}
.panel-head + .sec,.panel-head + div > .sec:first-child{margin-top:0;padding-top:0;border-top:0}
.sec-title{display:block;margin:0 0 var(--s3);font-size:19px;font-weight:700;line-height:1.4;letter-spacing:-0.01em}
.sub{margin:var(--s3) 0 0;font-size:14px;line-height:1.6;color:var(--ink-2)}

.opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.btn{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:var(--tap);padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;line-height:1.3;text-align:left;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink)}
.btn .box{flex:none;width:12px;height:12px;border-radius:3px;border:1.5px solid currentColor}
.btn[aria-pressed="true"] .box{background:currentColor}
.steps{display:flex;flex-direction:column;gap:var(--s2)}
.steps .btn{padding:var(--s2) var(--s3);gap:var(--s3)}
.step-num{flex:none;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid;font-size:12px;font-weight:700;color:var(--ink)}
.step-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.step-txt b{font-size:15px;font-weight:700}
.step-txt span{font-size:13px;font-weight:500;color:var(--ink-2)}
.detail{margin-top:var(--s3);padding:var(--s4);border-radius:var(--radius);background:var(--surface);font-size:15px;line-height:1.7}


.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:var(--s3);border-radius:var(--radius);background:var(--surface)}
.tile b{display:block;font-size:20px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:13px;line-height:1.4;color:var(--ink-2)}
.events{display:flex;flex-direction:column;gap:var(--s2)}
.event{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.6}
.dot{flex:none;width:10px;height:10px;margin-top:7px;border-radius:50%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2) var(--s3);font-size:13px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:var(--s2)}
.sw{flex:none;width:16px;height:6px;border-radius:3px}
.sw.ball{width:12px;height:12px;border-radius:50%}
.sec.warn{border-top:0;padding:var(--s4);border-radius:var(--radius);background:var(--surface);font-size:15px;line-height:1.7}
.warn .sec-title{color:var(--warn);font-size:17px}
.mistake{margin-top:var(--s3)}
.mistake b{display:block;font-weight:700}
.mistake span{color:var(--ink-2)}

.canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.canvas.is-fixed{cursor:default}
.view-btns{position:absolute;top:var(--s3);right:var(--s3);display:flex;gap:6px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);cursor:pointer}
.icon-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.float{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.hover-card{position:absolute;left:var(--s3);bottom:var(--s3);display:flex;flex-direction:column;gap:2px;padding:var(--s3) var(--s4);pointer-events:none}
.hover-card .k{font-size:13px;color:var(--ink-2)}
.hover-card .v{font-size:18px;font-weight:700}
.playbar{position:absolute;left:var(--s3);right:var(--s3);bottom:var(--s3);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3)}
.play{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--radius);background:var(--btn-bg);color:var(--on-btn) !important;cursor:pointer}
.play svg{width:18px;height:18px;fill:currentColor}
.scrub{flex:1 1 200px;min-width:160px;display:flex;flex-direction:column;gap:2px}
.scrub span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.scrub input{width:100%;height:24px;margin:0;accent-color:var(--accent)}
.speeds{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--radius)}
.speeds button{min-width:48px;height:40px;padding:0 var(--s2);border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.speeds button[aria-pressed="true"]{background:var(--btn-bg);color:var(--on-btn)}

@media (hover:hover){.btn:hover,.icon-btn:hover{background:var(--surface)}.text-btn:hover{background:var(--surface)}}
.layout.is-docked .panel-head{display:none}
.layout.is-docked{--pl:var(--pl-user,clamp(260px,20vw,320px));--pr:var(--pr-user,clamp(320px,24vw,400px))}
.layout.is-docked .panel{width:0;border-width:0;visibility:hidden;transition:width var(--dur-exit) ease-in,visibility 0s linear var(--dur-exit)}
.layout.is-docked .panel-left.is-open{width:var(--pl)}
.layout.is-docked .panel-right.is-open{width:var(--pr)}
.layout.is-docked .panel.is-open{visibility:visible;border-width:1px;transition:width var(--dur) var(--ease-out)}
.layout.is-docked .panel-left .panel-inner{width:var(--pl)}
.layout.is-docked .panel-right .panel-inner{width:var(--pr);align-self:flex-end}
.layout.is-docked.is-resizing .panel{transition:none}
.layout.is-docked.is-resizing{cursor:col-resize;user-select:none}
.layout.is-docked .panel-resize{display:block;position:absolute;top:0;bottom:0;z-index:2;width:12px;padding:0;border:0;background:transparent;cursor:col-resize;touch-action:none}
.layout.is-docked .panel-left .panel-resize{right:0}
.layout.is-docked .panel-right .panel-resize{left:0}
.layout.is-docked .panel-resize::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:0;transition:opacity 150ms ease-out}
.layout.is-docked .panel-left .panel-resize::after{right:0}
.layout.is-docked .panel-right .panel-resize::after{left:0}
.layout.is-docked .panel-resize:focus-visible{outline:none}
.layout.is-docked .panel-resize:focus-visible::after,.layout.is-docked.is-resizing .panel-resize:active::after{opacity:1}
@media (hover:hover){.layout.is-docked .panel-resize:hover::after{opacity:1}}
.layout:not(.is-docked){grid-template-columns:minmax(0,1fr)}
.layout:not(.is-docked) .stage{grid-column:1}
.layout:not(.is-docked) .panel{position:fixed;top:0;bottom:0;z-index:40;visibility:hidden;transition:transform var(--dur-exit) ease-in,visibility 0s linear var(--dur-exit)}
.layout:not(.is-docked) .panel-left{left:0;width:min(304px,88vw);transform:translateX(-100%)}
.layout:not(.is-docked) .panel-right{right:0;width:min(360px,88vw);transform:translateX(100%)}
.layout:not(.is-docked) .panel.is-open{visibility:visible;transform:none;transition:transform var(--dur) var(--ease-out)}
.layout:not(.is-docked) .panel-inner{padding-top:calc(var(--s3) + env(safe-area-inset-top));padding-bottom:calc(var(--s6) + env(safe-area-inset-bottom))}
.layout:not(.is-docked) .scrim{display:block;position:fixed;inset:0;z-index:35;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity var(--dur-exit) ease-in,visibility 0s linear var(--dur-exit)}
.layout:not(.is-docked) .scrim.is-on{opacity:1;visibility:visible;transition:opacity var(--dur) var(--ease-out)}
@media (max-width:640px){.brand{display:none}.topbar{justify-content:space-between}}
@media (max-width:480px){.panel-toggle span{display:none}.seg button{padding:0 var(--s2)}}
@media (prefers-reduced-motion:reduce){.panel,.panel.is-open,.scrim,.scrim.is-on,.panel-toggle .strip,.panel-resize::after{transition:none}}

-heading span{font-size:12px;color:var(--ink-2)}.memory{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;padding:0 20px 20px 0;min-height:280px;zoom:var(--zoom,1)}.frame{min-width:0;align-self:start}.frame h3{margin:0 0 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.frame small{display:block;font-size:12px;color:var(--ink-2);font-weight:400}.cell{display:block;text-align:left;width:100%;margin:0 0 10px;padding:10px 12px;min-height:76px;position:relative;z-index:1;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.cell-name{font:600 15px/1.3 Consolas,monospace}.cell-address{font:11px/1.5 Consolas,monospace;color:var(--ink-2);display:block}.cell-value{display:block;font:600 14px/1.5 Consolas,monospace;color:var(--accent-ink)}.cell.written{border:2px solid var(--accent);padding:9px 11px;background:var(--surface)}.cell.read{border-style:dashed;border-color:var(--read)}.cell.selected{outline:2px solid var(--accent);outline-offset:2px}.cell.ended{opacity:.65;border-style:dashed}.cell.ended .cell-value{color:var(--ended)}.memory-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}.app[data-addresses=false] .cell-address{display:none}.app[data-arrows=false] .memory-svg{display:none}.selection{font-size:14px;color:var(--ink-2);line-height:1.8}.selection strong{color:var(--ink)}.phase{font-size:12px;color:var(--ink-2);margin:0 0 8px}.step-title{font-size:17px;margin:0 0 12px}.explanation{margin:0;line-height:1.85}.diagnostic{color:var(--warn);font-size:14px}.changes{font-size:14px}.change{padding:8px 0;border-bottom:1px solid var(--line)}.trace-message,.empty{font-size:13px;color:var(--ink-2)}.playbar{position:relative;left:auto;right:auto;bottom:auto;flex:none;margin:12px}.transport-buttons{display:flex;gap:2px}.transport-buttons .icon-btn{border:0;background:transparent}.transport-buttons .play{background:var(--btn-bg)}.transport-buttons svg{width:1 /* Match biology panel prose and warning typography. */
.explanation{font-size:15px;line-height:1.6}.selection,.changes{font-size:15px;line-height:1.6}.takeaway{font-size:15px;line-height:1.7}.source-note{font-size:14px;line-height:1.6}

.transport-buttons .play svg{fill:currentColor;stroke:none}

/* Line-by-line tree lesson. */
.app[data-kind=c-tree] {
  --tree-fill: #edf5ff;
  --tree-green: #17704a;
  --tree-green-bg: #e8f7ee;
  --tree-warm: #a24616;
  --tree-warm-bg: #fff1e6;
}
html[data-theme=dark] .app[data-kind=c-tree] {
  --tree-fill: #202e43;
  --tree-green: #83dbab;
  --tree-green-bg: #223b30;
  --tree-warm: #ffc597;
  --tree-warm-bg: #3d2b25;
}
[data-kind=c-tree] .topbar { padding: 6px 16px; }
[data-kind=c-tree] .brand { display: block; }
.tree-header-tools { display: flex; align-items: center; gap: 4px; min-width: 0; }
.tree-header-tools .configuration { border: 0; margin: 0; padding: 0; min-width: 0; }
.tree-header-tools select { font-size: 14px; }
.tree-header-tools .configuration > label { position: relative; }
.tree-header-tools [data-action=preset] { appearance: none; padding-inline-end: 28px; }
.tree-header-tools .configuration > label::after {
  content: ''; position: absolute; inset-inline-end: 12px; top: calc(50% - 4px);
  width: 7px; height: 7px; transform: rotate(45deg); pointer-events: none;
  border: solid var(--ink-2); border-width: 0 1.5px 1.5px 0;
}
.tree-header-tools .input-error { margin: 0; }
[data-kind=c-tree] .layout { position: relative; }
[data-kind=c-tree] .layout.is-docked { --pl: var(--pl-user, 320px); --pr: var(--pr-user, 300px); }
[data-kind=c-tree] .layout:not(.is-docked) .panel-left { width: min(336px, 88vw); }
[data-kind=c-tree] .layout:not(.is-docked) .panel-head { justify-content: flex-end; }
[data-kind=c-tree] .stage-viewport { padding: 16px; }
[data-kind=c-tree] .source-pane { border: 0; padding: 0; margin: 0; }
[data-kind=c-tree] .source-pane h2,
[data-kind=c-tree] .tree-sidebar .sec-title,
[data-kind=c-tree] .pane-heading h2 { margin: 0 0 8px; font-size: 16px; }
[data-kind=c-tree] .code { font-size: 13px; max-height: none; }
[data-kind=c-tree] .line-number { width: 17px; margin-right: 8px; }
[data-kind=c-tree] .code-line { position: relative; padding-left: 20px; }
[data-kind=c-tree] .code-line.current::before {
  content: '▶';
  position: absolute;
  left: 3px;
  color: var(--accent-ink);
}

<script>(function (root) {
 'use strict';
 const D=root.DSInteractive;

  const element=document.createElementNS('http://www.w3.org/2000/svg',tag);

 function render(step,selection,metadata,view=D.getTreeView(metadata.tree,step)){
  const scene=D.el('div','tree-scene');
  if(view.rootId===null){
   scene.append(D.el('p','tree-empty','빈 트리 · root = NULL'));
   return scene;
  }

  const nodes=new Map(view.nodes.map(node=>[node.id,node])), points=new Map();
  let slot=0, maxDepth=0;
  function place(id,depth){
   if(id===null)return;
   const node=nodes.get(id);
   place(node.leftId,depth+1);
   points.set(id,{x:++slot,y:40+depth*76});
   maxDepth=Math.max(maxDepth,depth);
   place(node.rightId,depth+1);
  }
  place(view.rootId,0);
  const width=slot+1, height=108+maxDepth*76;
  scene.style.minWidth=Math.max(224,width*42)+'px';
  scene.style.setProperty('--tree-height',height+'px');

  const links=svg('svg',{class:'tree-links',viewBox:'0 0 '+width+' '+height,preserveAspectRatio:'none','aria-hidden':'true'});
  const pathIds=new Set(view.stack.map(frame=>frame.nodeId));

   links.append(svg('line',{x1:from.x,y1:from.y,x2:to.x,y2:to.y,class:className,'vector-effect':'non-scaling-stroke'}));
  }
  scene.append(links);
  for(const node of view.nodes){
   const point=points.get(node.id);
   for(const child of [node.leftId,node.rightId]){
    if(child!==null)edge(point,points.get(child),pathIds.has(node.id)&&pathIds.has(child)?'tree-path':'tree-edge');
   }
   const active=view.activeNodeId===node.id;
   const selected=selectedCell?.owner===node.id||
    selectedCell?.lifetime==='live'&&selectedCell.value.kind==='pointer'&&step.state.cells[selectedCell.value.target]?.owner===node.id;
   const label=String(node.key);

  const value=state.cells[frame.parameterCellId]?.value;
  if(!value)return frame.functionId;
  const target=state.cells[value.target];
  const node=state.objects[target?.owner];
  const key=node?.cellIds.map(id=>state.cells[id]).find(cell=>cell.name===keyField);

  const list=D.el('ol','tree-stack-list');
  const {state}=step;
  const rows=view.stack.map((frame,index)=>({
   id:frame.frameId,
   label:frame.parameterCellId===null?'호출자':treeCallLabel(state,state.frames[frame.frameId],keyField),
   status:index===0?'현재':view.stack[index-1].resumeAt ? view.stack[index-1].resumeAt.line+'행에서 재개' : '대기'
  }));
  for(const id of new Set([justReturned?.id,selectedId])){
   if(!id||rows.some(row=>row.id===id))continue;
   const returned=state.frames[id];
   const label=returned?treeCallLabel(state,returned,keyField):'선택한 호출';

  for(const row of rows){
   const frame=state.frames[row.id];
   const item=D.el('li','tree-frame');
   if(row.status==='현재')item.dataset.frameState='active';
   const expanded=row.id===selectedId;

    item.append(memoryTable(step,ids,frame.lifetime==='ended'));
   }
   list.append(item);
  }
  return list;

    const next=printNeighbor(action==='previous-output'?-1:1);
    if(next>=0)move(next);
   }
   if(action==='theme'){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';q('[data-action=theme]').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(dark?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>')+'</svg>';q('[data-action=theme]').setAttribute('aria-label',dark?'밝은 테마로 전환':'어두운 테마로 전환');}
  });
  on(q('[data-action=scrub]'),'input',e=>move(Number(e.target.value)));
  on(document,'keydown',e=>{if(e.defaultPrevented||app.querySelector('dialog:modal,[aria-modal=true]')||/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName)||e.target.matches?.('.tree-history .step-list'))return;if(['ArrowLeft','ArrowRight','Home','End',' '].includes(e.key)){e.preventDefault();if(e.key===' ')toggle();else move(e.key==='Home'?0:e.key==='End'?entries().length-1:step+(e.key==='ArrowRight'?1:-1));}});
  on(window,'resize',redraw);
  if(!tree){q('.provenance-text').textContent=scenario.sources.map(s=>`${s.label}: ${s.provenance?.path||'보충 예제'}${s.provenance?.page?' · p'+s.provenance.page:''}${s.provenance?.section?' · '+s.provenance.section:''}${s.provenance?.adjustments?' · '+s.provenance.adjustments:''}`).join('\n');q('.provenance-text').style.whiteSpace='pre-line';}
  recompile();
  return {destroy(){stop();destroyed=true;treeUi?.destroy();shell.destroy();listeners.forEach(f=>f());}};
 }
 D.mountPlayer=mountPlayer;
})(globalThis);
</script>
<script>(function (root) {
 'use strict';
 const cases={
  intro:[[8,3,10],[3,1,null],[1,null,null],[10,null,null]],
  lecture:[[18,7,26],[7,3,12],[3,null,null],[12,null,null],[26,null,31],[31,27,null],[27,null,null]],
  empty:[]
 };
 const note='복습노트/1105/.pack/정리노트_1105_Tree.md';
 const tree={rootCellId:'main.root',fields:{key:'key',left:'left',right:'right'}};
 const at=(sourceId,line)=>({sourceId,line});
 const walk=line=>at('walk',line);
 const nodeId=key=>'node-'+key;
 const keyCell=key=>nodeId(key)+'.key';
 const pointer=key=>({kind:'pointer',target:key===null?null:keyCell(key)});
 const cell=(owner,name,type,value)=>({
  id:owner+'.'+name,name,type,owner,address:'&'+owner+'.'+name,value,lifetime:'live'
 });

 const scenario={
  version:1,id:'inorder-1105',kind:'c-tree',tree,title:'중위 순회 한 줄씩 실행하기',
  watch:[{name:'p',label:'현재 호출이 가리키는 노드'}],
  intro:'루트에서 순회를 시작할 준비가 됐어요.',
  takeaway:'왼쪽 호출이 반환되면 현재 키를 출력합니다. 오른쪽 호출도 반환되면 현재 호출을 끝냅니다.',
  supplement:'1105 강의의 트리와 방문 순서를 바탕으로 실행을 관찰할 C 함수와 호출자를 보충했습니다.',
  sources:[
   {id:'walk',label:'inorder 함수',language:'c',text:[
    'void inorder(Node *p) {',
    '    if (p == NULL) return;',
    '    inorder(p->left);',
    '    printf("%d ", p->key);',
    '    inorder(p->right);',
    '}'
   ].join('\n'),provenance:{path:note,section:'§4 순회 · 중위 순회',supplement:true}},
   {id:'driver',label:'호출자',language:'c',text:'inorder(root);',
    provenance:{path:note,section:'§4 순회 · 중위 순회',supplement:true}}
  ],
  inputs:[{key:'treeCase',label:'트리 사례',type:'enum',default:'intro',options:[
   {value:'intro',label:'입문 트리 · 4개 노드'},
   {value:'lecture',label:'1105 강의 트리 · 7개 노드'},
   {value:'empty',label:'빈 트리 · NULL'}
  ]}],
  presets:[
   {id:'lecture',label:'1105 강의 트리',input:{treeCase:'lecture'}},
   {id:'empty',label:'빈 트리',input:{treeCase:'empty'}}
  ],
  initialState({treeCase}){
   const root=cell('main','root','Node *',pointer(cases[treeCase][0]?.[0]??null));
   const cells={[root.id]:root}, objects={};
   for(const [key,left,right] of cases[treeCase]){
    const id=nodeId(key);
    const fields=[
     cell(id,'key','int',{kind:'int',value:key}),
     cell(id,'left','Node *',pointer(left)),
     cell(id,'right','Node *',pointer(right))
    ];
    objects[id]={id,type:'Node',storage:'static',cellIds:fields.map(field=>field.id),lifetime:'live'};
    for(const field of fields)cells[field.id]=field;
   }
   const main={id:'main',functionId:'main',caller:null,cellIds:[root.id],lifetime:'live'};
   return {frames:{main},objects,cells,activeFrame:'main',stdout:[]};
  },
  *generateEvents({treeCase}){
   const nodes=new Map(cases[treeCase].map(([key,left,right])=>[key,{left,right}]));
   let nextFrame=0, nextLine=0;
   function* line(at,title,explanation,events){
    const lineStepId='inorder-'+(++nextLine);
    for(const event of events)yield {at,lineStepId,label:title,explanation,...event};
   }
   function* call(key,sourceCellId,callSite,resumeAt,parent){
    const id='call-'+(++nextFrame), value=pointer(key), parameter=cell(id,'p','Node *',value);
    const side=parent?.side==='left'?'왼쪽':'오른쪽';
    const label='inorder('+(key??'NULL')+')';
    const callMessage=parent ?
     (key===null ? parent.key+'의 '+side+' 자식이 비어 있어 '+label+'을 호출했어요.' :
      parent.key+'의 '+side+' 자식 주소로 '+label+'을 호출했어요.') :
     (key===null ? '루트가 비어 있어 inorder(NULL)을 호출했어요.' :
      '루트 노드의 주소로 '+label+'을 호출했어요.');
    yield* line(callSite,parent?side+' 자식 호출':'루트에서 순회 시작',callMessage,[
      {kind:'read',cellId:sourceCellId,...(parent&&{memberOf:parent.parameterId})},
      {kind:'call',frame:{id,functionId:'inorder',callSite,resumeAt,
       argumentSourceCellId:sourceCellId,parameterCellId:parameter.id}},
      {kind:'bind',cell:parameter,value,fromCellId:sourceCellId},
      {kind:'enter',frameId:id}
     ]);
    const nullReturn=parent ? side+' 자식이 NULL이라 '+parent.key+'번 노드의 호출로 돌아왔어요.' :
     '루트가 NULL이므로 키를 출력하지 않고 순회를 마쳤어요.';
    yield* line(walk(2),key===null?'NULL이라 반환':'NULL 조건 검사',
     key===null?nullReturn:'p가 '+key+'번 노드를 가리켜 왼쪽 자식 호출로 넘어가요.',[
      {kind:'read',cellId:parameter.id},
      ...(key===null?[{kind:'return',frameId:id}]:[])
     ]);
    if(key===null)return;
    const {left,right}=nodes.get(key);
    yield* call(left,nodeId(key)+'.left',walk(3),walk(4),{key,parameterId:parameter.id,side:'left'});
    yield* line(walk(4),'현재 키 출력','현재 노드의 키를 읽어 '+key+' 값을 출력했어요.',[
     {kind:'print-int',cellId:keyCell(key),memberOf:parameter.id}
    ]);
    yield* call(right,nodeId(key)+'.right',walk(5),walk(6),{key,parameterId:parameter.id,side:'right'});
    const returned=parent ? key+'번 노드의 순회를 마치고 '+parent.key+'번 노드의 호출로 돌아왔어요.' :
     '루트 호출에서 반환해 순회를 마쳤어요.';
    yield* line(walk(6),'현재 호출에서 반환',returned,[
     {kind:'return',frameId:id}
    ]);
   }
   yield* call(cases[treeCase][0]?.[0]??null,tree.rootCellId,at('driver',1),null);
  }
 };
 if(typeof module!=='undefined'&&module.exports)module.exports=scenario;
 else root.DSInteractive.scenario=scenario;
})(globalThis);
</script>
<script>DSInteractive.player=DSInteractive.mountPlayer(document.querySelector('#app'),DSInteractive.scenario);</script>
