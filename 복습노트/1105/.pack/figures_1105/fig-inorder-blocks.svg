<svg xmlns="http://www.w3.org/2000/svg" width="412" height="172" viewBox="0 0 412 172" role="img" aria-label="18을 가운데 강조색 테두리 칸에 두고, 왼쪽 큰 테두리 칸에 3, 7, 12를, 오른쪽 큰 테두리 칸에 26, 27, 31을 넣은 그림이에요. 왼쪽 칸 안은 3이 든 작은 칸, 7, 12가 든 작은 칸 순서예요. 오른쪽 칸 안은 빈 칸, 26, 27과 31이 든 칸 순서이고, 그 칸 안은 다시 27이 든 칸, 31, 빈 칸 순서예요. 아래 화살표를 따라 왼쪽부터 읽으면 3, 7, 12, 18, 26, 27, 31이에요."><style>
