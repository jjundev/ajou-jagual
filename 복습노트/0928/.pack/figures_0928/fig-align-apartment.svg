<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="네 칸짜리 층 두 개. 1층 첫 칸에는 작은 짐을 뜻하는 색칠된 점 하나, 1층 나머지 세 칸은 점선 테두리로 비어 있고, 2층 네 칸 전체를 큰 짐을 뜻하는 강조 테두리 하나가 감싸는 모습"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
