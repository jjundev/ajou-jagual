<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-label="주소로 넘기기, 6/6단계, 방금 실행한 줄 printf(&quot;swap을 호출한 다음: …&quot;, a,b);. main의 a=2, b=1. swap은 끝나 px, py, tmp가 사라짐. 방금 실행한 줄은 강조색 테두리와 색칠된 점, 방금 바뀐 칸은 강조색 테두리로 표시."><style>
