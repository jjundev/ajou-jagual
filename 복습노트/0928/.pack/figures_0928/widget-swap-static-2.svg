</style><rect x="0" y="0" width="640" height="350" rx="10" fill="#ffffff"/><text class="fig-muted" x="12" y="18">코드</text><rect class="fig-accent" x="8" y="262" width="326" height="20" rx="3"/><circle class="fig-dot" cx="16" cy="272" r="4"/><text class="fig-text" x="26" y="36" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">void swap(int *px, int *py)</text><text class="fig-text" x="26" y="56" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">{</text><text class="fig-text" x="26" y="76" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">    int tmp;</text><text class="fig-text" x="26" y="96" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">    tmp = *px;</text><text class="fig-text" x="26" y="116" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">    *px = *py;</text><text class="fig-text" x="26" y="136" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">    *py = tmp;</text><text class="fig-text" x="26" y="156" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">}</text><text class="fig-text" x="26" y="176" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">main()</text><text class="fig-text" x="26" y="196" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">{</text><text class="fig-text" x="26" y="216" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">    int a=1,b=2;</text><text class="fig-text" x="26" y="236" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">    printf("swap을 호출하기 전: …", a,b);</text><text class="fig-text" x="26" y="256" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">    swap(&amp;a, &amp;b);</text><text class="fig-text" x="26" y="276" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">    printf("swap을 호출한 다음: …", a,b);</text><text class="fig-text" x="26" y="296" xml:space="preserve" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre">}</text><rect class="fig-ink" x="350" y="24" width="280" height="100" rx="6"/><text class="fig-muted" x="360" y="42">main</text><rect class="fig-ink" x="380" y="64" width="80" height="44" rx="4"/><text class="fig-muted" x="386" y="78" style="font-size:12px">a</text><text class="fig-text" x="420" y="100" text-anchor="middle" style="font-size:16px;font-weight:600">2</text><rect class="fig-ink" x="490" y="64" width="80" height="44" rx="4"/><text class="fig-muted" x="496" y="78" style="font-size:12px">b</text><text class="fig-text" x="530" y="100" text-anchor="middle" style="font-size:16px;font-weight:600">1</text><rect class="fig-ink" x="350" y="170" width="280" height="110" rx="6" stroke-dasharray="6 5"/><text class="fig-muted" x="360" y="188">swap (끝남: 지역 변수 정리됨)</text><rect class="fig-ink" x="370" y="210" width="70" height="44" rx="4" stroke-dasharray="4 4" style="opacity:0.5"/><text class="fig-muted" x="376" y="224" style="font-size:12px">px</text><text class="fig-text" x="405" y="246" text-anchor="middle" style="font-size:16px;font-weight:600">–</text><rect class="fig-ink" x="460" y="210" width="70" height="44" rx="4" stroke-dasharray="4 4" style="opacity:0.5"/><text class="fig-muted" x="466" y="224" style="font-size:12px">py</text><text class="fig-text" x="495" y="246" text-anchor="middle" style="font-size:16px;font-weight:600">–</text><rect class="fig-ink" x="550" y="210" width="70" height="44" rx="4" stroke-dasharray="4 4" style="opacity:0.5"/><text class="fig-muted" x="556" y="224" style="font-size:12px">tmp</text><text class="fig-text" x="585" y="246" text-anchor="middle" style="font-size:16px;font-weight:600">–</text><text class="fig-muted" x="350" y="306">출력</text><text class="fig-text" x="390" y="306" style="font-size:12px">swap을 호출하기 전: a=1, b=2</text><text class="fig-text" x="390" y="326" style="font-size:12px">swap을 호출한 다음: a=2, b=1</text></svg>
