<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-label="테두리만 있는 방 여섯 칸에 101호부터 106호까지 적혀 있다. 101호 위에서 102호 위로 강조색 곡선 화살표가 한 칸을 건너가고, 그 위에 다음 방이라고 적혀 있다."><style>
