<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="위쪽 내 방 테두리 안의 첫째 칸 1과 둘째 칸 2는 그대로다. 각 칸에서 아래 친구 테두리 안의 복사본으로 복사라고 적힌 화살표가 내려간다. 친구의 복사본은 1에서 2로, 2에서 1로 바뀌어 강조색 테두리로 표시된다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
