<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 420 160" role="img" aria-label="왼쪽 테두리 쪽지 안에 가리킬 대상 종류인 철가방이 적혀 있고, 쪽지에서 나온 화살표가 오른쪽 큰 테두리 상자인 철가방을 통째로 가리킨다. 철가방 안에는 짜장면과 탕수육 칸이 테두리로 그려져 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
