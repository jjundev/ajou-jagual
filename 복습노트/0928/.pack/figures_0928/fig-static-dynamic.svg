<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="왼쪽은 미리 잡은 열 칸 가운데 세 칸만 색칠된 점으로 채워지고 일곱 칸이 빈 테두리로 남은 모습, 오른쪽은 필요한 세 칸만 받아 모두 색칠된 점으로 채운 모습"><style>
