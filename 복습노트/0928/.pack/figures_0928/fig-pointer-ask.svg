<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" role="img" aria-label="가운데에 선으로만 그린 집 한 채가 있고 지붕 아래에 26번지, 집 안에 A가 적혀 있다. 왼쪽 질문 &#x27;어디 살아?&#x27;에서 나온 선 화살표가 번지를 가리키며 답은 26이고, 오른쪽 질문 &#x27;안에 뭐 있어?&#x27;에서 나온 선 화살표가 집 안을 가리키며 답은 A이다."><style>
