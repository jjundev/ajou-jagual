<svg xmlns="http://www.w3.org/2000/svg" width="560" height="256" viewBox="0 0 560 256" role="img" aria-label="배열 A의 char 원소 여섯 칸, 한 칸 1바이트, 주소 10, 11, 12, 13, 14, 15번지. 가리키는 칸: p → A[3](13번지), p+2 → A[5](15번지). p+2 칸은 강조색 테두리, 그 화살표 꼬리는 색칠된 점이고, 한 칸 건너뛸 때마다 칸 위에 강조색 곡선 화살표가 하나씩 그려진다."><style>
