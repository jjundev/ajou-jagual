<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="테두리만 있는 네모 세 개가 왼쪽부터 물건(26번지, 안에 보물), 쪽지 1(56번지, 안에 26), 쪽지 2(89번지, 안에 56) 순서로 놓여 있다. 쪽지 2에서 쪽지 1로, 쪽지 1에서 물건으로 강조색 선 화살표가 이어진다."><style>
