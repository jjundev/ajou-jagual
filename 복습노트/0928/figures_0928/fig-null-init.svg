<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="왼쪽: 테두리만 있는 쪽지 네모 안에 없음이라고 적혀 있고 화살표가 없다. 오른쪽: 테두리만 있는 쪽지 네모 안에 10이 적혀 있고, 경고색 선 화살표가 경고색 테두리의 중요한 곳 네모를 가리킨다."><style>
