<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="오른쪽에 98번지에 놓인 배달 가방 테두리가 있고, 1층 칸에 2, 2층 칸에 3.14가 들어 있다. 왼쪽 쪽지 테두리에는 98이 적혀 있고, 쪽지에서 가방으로 강조색 화살표가 이어진다."><style>
