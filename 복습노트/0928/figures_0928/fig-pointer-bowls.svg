<svg xmlns="http://www.w3.org/2000/svg" width="420" height="170" viewBox="0 0 420 170" role="img" aria-label="왼쪽 테두리 그릇은 국그릇이고 안에 밥그릇이 있는 곳이 적혀 있다. 화살표가 오른쪽 테두리 그릇인 밥그릇을 가리키고, 밥그릇 안에는 값이 들어 있다."><style>
