<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" role="img" aria-label="왼쪽에 선으로 그린 작은 개집, 오른쪽에 창문이 많은 높은 빌딩 테두리가 있다. 빌딩은 강조색 선으로 그렸고, 오른쪽에 앞으로 뻗은 화살표와 함께 빨리, 안쪽으로 모이는 두 화살표와 함께 좁게라는 글자가 붙어 있다."><style>
