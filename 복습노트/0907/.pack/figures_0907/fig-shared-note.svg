<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="왼쪽은 두 사람이 선 화살표로 테두리만 있는 노트 한 권을 함께 가리킨다. 오른쪽은 노트를 화살표 방향으로 복사해 테두리 노트가 두 권이 되고 두 사람이 한 권씩 옆에 서 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
