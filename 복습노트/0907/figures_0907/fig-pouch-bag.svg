<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" role="img" aria-label="왼쪽 가방은 선으로 나뉜 주머니 네 칸이고, 그중 한 칸에만 경고색 테두리의 얼룩 원이 있다. 오른쪽 가방은 칸 없이 뒤엉킨 선이 가득하고 경고색 테두리 얼룩이 가방 전체에 걸쳐 있다."><style>
