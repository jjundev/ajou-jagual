<svg xmlns="http://www.w3.org/2000/svg" width="560" height="175" viewBox="0 0 560 175" role="img" aria-label="시간 막대 두 줄. 위 줄은 아침 한 시간만 색칠된 막대가 있고 그 뒤는 비어 있다. 아래 줄은 같은 색칠된 막대 뒤로 밤 10시까지 이어지는 경고색 테두리 막대가 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="560" height="175" rx="10" fill="#ffffff"/>
      <text class="fig-text" x="10" y="57">공부하고 반납</text>
      <rect class="fig-dot" x="150" y="40" width="30" height="24"/>
      <text class="fig-muted" x="192" y="57">자리 비움</text>
      <text class="fig-text" x="10" y="107">짐만 두고 감</text>
      <rect class="fig-dot" x="150" y="90" width="30" height="24"/>
      <rect class="fig-danger" x="180" y="90" width="360" height="24"/>
      <text class="fig-muted" x="360" y="107" text-anchor="middle">공부는 안 하고 자리만 차지</text>
      <line class="fig-ink" x1="150" y1="140" x2="540" y2="140"/>
      <line class="fig-ink" x1="150" y1="134" x2="150" y2="146"/>
      <line class="fig-ink" x1="540" y1="134" x2="540" y2="146"/>
      <text class="fig-muted" x="150" y="165" text-anchor="middle">아침 9시</text>
      <text class="fig-muted" x="535" y="165" text-anchor="end">밤 10시</text>
