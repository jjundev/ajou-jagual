<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="왼쪽은 테두리 네모 매표소 앞에 첫째, 둘째, 셋째 사람이 테두리 동그라미로 줄 서 있고, 맨 앞 사람에게서 매표소 쪽으로 화살표가 있는 그림이에요. 오른쪽은 위에서부터 빨간 책, 초록 책, 갈색 책이 테두리 네모로 쌓여 있고, 맨 위 책에서 위쪽으로 화살표가 있는 그림이에요."><style>
