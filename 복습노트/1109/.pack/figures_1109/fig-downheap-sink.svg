<svg xmlns="http://www.w3.org/2000/svg" width="600" height="255" viewBox="0 0 600 255" role="img" aria-label="번호가 붙은 원(테두리) 아홉 개로 된 트리. 꼭대기 1번 자리에 맨 끝에서 올라온 3이 강조색 테두리 원으로 있고, 2번 7, 3번 6, 4번 5, 5번 4, 6번 3, 7번 2, 8번 2, 9번 1이 있음. 강조색 선 화살표가 1번에서 2번으로, 2번에서 4번으로 아래를 향하고, 그림 아래에 3은 4번 자리에서 아래 값 2보다 커서 멈춤이라는 글자가 있음."><style>
