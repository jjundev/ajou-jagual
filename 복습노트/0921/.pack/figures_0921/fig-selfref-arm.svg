<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="나라고 적힌 상자 테두리에서 나와 같은 모양의 상자 테두리로 화살표 선이 이어지고, 텔레비전 테두리로 가는 점선에는 가위표가 그려진 그림"><style>
