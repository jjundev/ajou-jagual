<svg xmlns="http://www.w3.org/2000/svg" width="560" height="130" viewBox="0 0 560 130" role="img" aria-label="테두리만 있는 칸 열 개가 한 줄로 붙어 있고 칸 아래에 0부터 9까지 번호가 있어요. 번호 4가 붙은 다섯째 칸은 강조색 테두리이고, 그 위에 색칠된 점이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
