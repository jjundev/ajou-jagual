<svg xmlns="http://www.w3.org/2000/svg" width="400" height="110" viewBox="0 0 400 110" role="img" aria-label="여섯 칸이 한 줄로 놓인 선 테두리 상자에 10, 0, 0, 0, 6, 3이 차례로 들어 있고, 0이 든 가운데 세 칸은 강조색 테두리로 표시한 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
