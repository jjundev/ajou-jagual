<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="왼쪽은 같은 네모 테두리 두 개가 나란히 든 줄 상자, 오른쪽은 손잡이가 달린 가방 테두리 안에 네모, 동그라미, 세모 테두리가 함께 든 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
