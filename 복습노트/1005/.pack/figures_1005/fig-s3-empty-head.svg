<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="세 칸짜리 테두리 상자 하나가 헤드 노드다. 칸은 왼쪽부터 llink, data, rlink이고 data 칸은 비어 있다. llink 칸의 색칠된 점에서 위로 돌아 같은 상자로 들어오는 곡선과, rlink 칸의 색칠된 점에서 아래로 돌아 같은 상자로 들어오는 곡선이 있다."><style>
