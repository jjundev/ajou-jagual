<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-label="위 줄은 올바른 순서로, 20이 먼저 30을 가리키고(1) 그다음 10이 20을 가리켜(2) 10, 20, 30, 40이 이어진 그림. 아래 줄은 거꾸로 한 경우로, 10이 20을 가리키지만 20 다음은 물음표이고 30과 40은 점선 테두리로 남아 아무도 가리키지 않는 그림"><style>
