<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="위쪽 왼쪽에 앞 친구, 위쪽 오른쪽에 뒤 친구, 아래 가운데에 새 친구 테두리 상자가 있다. 1번 선은 새 친구에서 앞 친구로, 2번 선은 새 친구에서 뒤 친구로 간다. 3번 선은 뒤 친구에서 새 친구로, 4번 선은 앞 친구에서 새 친구로 가며 3번과 4번 선은 강조색이다. 4번을 3번보다 먼저 하면 3번이 뒤 친구 대신 새 친구의 팔을 고치게 된다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
