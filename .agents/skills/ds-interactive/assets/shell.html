<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS Interactive</title><link rel="stylesheet" data-ds-interactive-font href="/*FONT_HREF*/"><style>/*CSS*/</style></head>
<body><main id="app" class="app" data-addresses="true" data-arrows="true">
<header class="topbar"><button class="text-btn panel-toggle" data-action="toggle-left" aria-label="조작 패널" aria-expanded="true" aria-controls="panel-left"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="strip" x="3" y="4" width="6" height="16" rx="1"/><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg><span>조작</span></button><h1 class="brand"></h1><div class="seg modes" role="group" aria-label="보기 선택" hidden></div><button class="text-btn theme-toggle" data-action="theme" aria-label="어두운 테마로 전환" title="어두운 테마로 전환"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button><button class="text-btn panel-toggle" data-action="toggle-right" aria-label="설명 패널" aria-expanded="true" aria-controls="panel-right"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="strip" x="15" y="4" width="6" height="16" rx="1"/><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg><span>설명</span></button></header>
<div class="layout"><aside class="panel panel-left is-open" id="panel-left" aria-label="조작"><div class="panel-resize" data-resize="left" role="separator" aria-orientation="vertical" tabindex="0" aria-label="왼쪽 패널 너비 조절. 좌우 화살표, Home 기본 너비" aria-valuemin="220" aria-valuemax="480" aria-valuenow="220"></div>
<div class="panel-inner"><div class="panel-head"><h2>조작</h2><button class="text-btn" data-action="close-panels">닫기</button></div>
<section class="sec"><h2 class="sec-title">보기 옵션</h2><div class="opt"><button class="btn" data-action="option-addresses" aria-pressed="true"><span class="box" aria-hidden="true"></span>주소 표시</button><button class="btn" data-action="option-arrows" aria-pressed="true"><span class="box" aria-hidden="true"></span>화살표</button></div></section>
<section class="sec configuration" aria-label="실행 조건"><h2 class="sec-title">실행 조건</h2><label><select data-action="preset" aria-label="사례"></select></label><div class="inputs"></div><p class="input-error" role="alert"></p></section>
<section class="sec source-pane"><h2 class="sec-title">실행 코드 <span class="source-label"></span></h2><div class="code" tabindex="0" aria-label="실행 코드"></div><p class="source-note"></p></section>
<section class="sec"><h2 class="sec-title">단계</h2><div class="steps step-list" aria-label="실행 단계 목록"></div></section>
</div></aside>
<section class="stage" aria-label="메모리 보기"><div class="stage-viewport tree-viewport"><div class="memory-pane"><div class="pane-heading"><h2>호출과 메모리</h2><span class="scene-note">주소는 기호로 표시</span></div><div class="memory" data-scale="1" aria-label="호출 프레임과 저장 공간"></div></div></div><div class="view-btns"><button class="icon-btn" data-action="zoom-in" aria-label="확대"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="icon-btn" data-action="zoom-out" aria-label="축소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button class="icon-btn" data-action="zoom-reset" aria-label="화면 맞춤"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg></button></div><div class="tree-output tree-only" hidden><div class="stdout-label">출력</div><div class="stdout-line"><output class="stdout-value" aria-label="표준 출력"></output><span class="stdout-empty">아직 출력 없음</span></div><div class="tree-jumps" role="group" aria-label="출력 시점 이동"><button class="btn" data-action="previous-output">이전 출력</button><button class="btn" data-action="next-output">다음 출력</button></div></div><footer class="playbar float" aria-label="재생 조작"><div class="transport-buttons"><button class="icon-btn" data-action="first" aria-label="처음 단계"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M18 5l-9 7 9 7z"/></svg></button><button class="icon-btn" data-action="prev" aria-label="이전 단계"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-8 7 8 7"/></svg></button><button class="play" data-action="play" aria-label="재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg></button><button class="icon-btn" data-action="next" aria-label="다음 단계"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 8 7-8 7"/></svg></button><button class="icon-btn" data-action="last" aria-label="마지막 단계"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M6 5l9 7-9 7z"/></svg></button></div><label class="scrub"><span>단계 <output data-step>0 / 0</output></span><input type="range" data-action="scrub" min="0" max="0" value="0" aria-label="실행 단계"></label><div class="speeds" role="group" aria-label="재생 속도"><button data-speed="0.5" aria-pressed="false">0.5×</button><button data-speed="1" aria-pressed="true">1×</button><button data-speed="2" aria-pressed="false">2×</button></div></footer></section>
<aside class="panel panel-right is-open" id="panel-right" aria-label="설명"><div class="panel-resize" data-resize="right" role="separator" aria-orientation="vertical" tabindex="0" aria-label="오른쪽 패널 너비 조절. 좌우 화살표, Home 기본 너비" aria-valuemin="280" aria-valuemax="720" aria-valuenow="280"></div>
<div class="panel-inner explanation-pane"><div class="panel-head"><h2>설명</h2><button class="text-btn" data-action="close-panels">닫기</button></div>
<section class="sec"><h2 class="sec-title">지금 일어나는 일</h2><p class="phase"></p><h3 class="step-title"></h3><p class="explanation" aria-live="polite"></p><div class="diagnostic" role="alert"></div></section>
<section class="sec"><h2 class="sec-title">변경 전 → 후</h2><div class="changes"></div></section>
<section class="sec"><h2 class="sec-title">선택한 변수</h2><div class="selection" aria-live="polite">변수를 선택하면 값과 주소를 구분해 볼 수 있습니다.</div></section>
<section class="sec warn"><h2 class="sec-title">꼭 기억해요</h2><p class="takeaway"></p></section>
<details class="provenance"><summary>출처와 학습 범위</summary><div class="provenance-text"></div><p>검토된 예제의 단계별 모형이에요. 기호 주소를 사용해요. ← / → 단계 이동 · Space 재생 · Home / End 처음과 마지막.</p><p>임의 C 코드를 컴파일하지 않아요.</p></details>
</div></aside><div class="scrim" data-action="close-panels" aria-hidden="true"></div></div></main>
<!--SCRIPTS-->
</body></html>
