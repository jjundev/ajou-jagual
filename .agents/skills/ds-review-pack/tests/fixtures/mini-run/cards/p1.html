        <h3>P1. 두 수의 평균</h3>

        <details class="hint"><summary>힌트 보기</summary>더해서 개수로 나눈다.</details>
        <details class="solution"><summary>풀이 보기</summary><ol class="steps"><li>$1 + 2 = 3$</li><li>$3 / 2$</li></ol><p class="answer">정답: $\frac{3}{2}$</p></details>
