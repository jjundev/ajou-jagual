<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="원문의 트리: +, *, *, /, A, B, C, D, E"><title>원문의 트리: +, *, *, /, A, B, C, D, E</title><g id="edge-plus-left"><line x1="400.0" y1="45" x2="200.0" y2="130" stroke="#26394a" stroke-width="2" /></g><g id="edge-plus-right"><line x1="400.0" y1="45" x2="600.0" y2="130" stroke="#26394a" stroke-width="2" /></g><g id="edge-mul1-left"><line x1="200.0" y1="130" x2="100.0" y2="215" stroke="#26394a" stroke-width="2" /></g><g id="edge-mul1-right"><line x1="200.0" y1="130" x2="300.0" y2="215" stroke="#26394a" stroke-width="2" /></g><g id="edge-mul2-left"><line x1="100.0" y1="215" x2="50.0" y2="300" stroke="#26394a" stroke-width="2" /></g><g id="edge-mul2-right"><line x1="100.0" y1="215" x2="150.0" y2="300" stroke="#26394a" stroke-width="2" /></g><g id="edge-div-left"><line x1="50.0" y1="300" x2="25.0" y2="385" stroke="#26394a" stroke-width="2" /></g><g id="edge-div-right"><line x1="50.0" y1="300" x2="75.0" y2="385" stroke="#26394a" stroke-width="2" /></g><g id="plus"><circle cx="400.0" cy="45" r="22" fill="#fff" stroke="#26394a" stroke-width="2" /><text x="400.0" y="45" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="22" fill="#17212b">+</text></g><g id="mul1"><circle cx="200.0" cy="130" r="22" fill="#fff" stroke="#26394a" stroke-width="2" /><text x="200.0" y="130" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="22" fill="#17212b">*</text></g><g id="mul2"><circle cx="100.0" cy="215" r="22" fill="#fff" stroke="#26394a" stroke-width="2" /><text x="100.0" y="215" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="22" fill="#17212b">*</text></g><g id="div"><circle cx="50.0" cy="300" r="22" fill="#fff" stroke="#26394a" stroke-width="2" /><text x="50.0" y="300" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="22" fill="#17212b">/</text></g><g id="A"><circle cx="25.0" cy